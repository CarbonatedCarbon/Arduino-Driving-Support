[pytest]
# Directory where tests reside
testpaths = tests

# Standard pytest naming patterns for automated discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Root directory added to pythonpath for clean imports
pythonpath = .

# Default command line options
addopts = -v --tb=short

# Custom test category markers
markers =
    hardware: tests that require physical BLE peripheral or Bluetooth hardware
